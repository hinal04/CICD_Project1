name: Simple CI/CD with Monitoring

on:
  push:
    branches:
      - main

jobs:
  test-and-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install requests pytest

      - name: Run tests
        run: pytest || echo "No tests yet"

      - name: Start app
        run: python app.py &

      - name: Monitor app
        run: python monitor.py
